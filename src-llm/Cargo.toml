[package]
name = "slimsort-llm"
version = "1.0.0"
edition = "2021"
description = "Hilfsprogramm für den KI-Chat von SlimSort: führt ein Sprachmodell (GGUF) mit llama.cpp aus"
license = "MIT"
publish = false

[dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["common"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["common", "metal"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
