# Baut die KI-Modelle (bei Änderung von scripts/ai/ oder src-llm/) und stellt sie als
# Download bereit. Die App lädt sie nur, wenn man die KI in den Einstellungen einschaltet.
# Als „Vorabversion“ markiert, damit die Download-Seite weiter auf die App zeigt.
name: KI-Modell bauen

on:
  push:
    paths: ['scripts/ai/**', 'src-llm/**', '.github/workflows/ki-modell.yml']
  workflow_dispatch:

jobs:
  # Stufe "Sparsam": CLIP (bleibt unter ki-modell-1)
  clip:
    if: false # fertig, siehe Release ki-modell-1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

  # Stufen "Ausgewogen"/"Maximal": SigLIP 2
  siglip:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: google/siglip2-base-patch16-224, id: siglip2-b16 }
          - { name: google/siglip2-large-patch16-256, id: siglip2-l16 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python-Pakete
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.49,<5" safetensors numpy sentencepiece protobuf huggingface_hub pillow torchvision --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Exportieren
        shell: bash
        run: |
          set -o pipefail
          python scripts/ai/export_siglip.py ${{ matrix.name }} ${{ matrix.id }} out 2>&1 | tee export.log || { grep -iE "error|exception|requires|install" export.log | tail -n 8 | sed 's|^|::error title=export::|'; exit 1; }
          grep -vE "Warning|warn" export.log | tail -n 30 | sed 's|^|::notice title=export::|'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ki-2
          name: KI-Modelle 2 (für SlimSort)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Wird von SlimSort automatisch geladen, je nach gewählter KI-Stufe. Nicht von Hand herunterladen nötig.
            Bild/Text: SigLIP 2 (Google, Apache-2.0), auf 8 Bit verkleinert.
            Sprache: Qwen3 (Alibaba, Apache-2.0), GGUF.
            Helfer-Programm: llama.cpp (MIT).
          files: |
            out/*

  # Sprachmodelle (GGUF)
  llm:
    if: contains(join(github.event.commits.*.modified, ','), 'llm_models.py') || contains(join(github.event.commits.*.added, ','), 'llm_models.py') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install huggingface_hub
      - name: Laden
        shell: bash
        run: |
          set -o pipefail
          python scripts/ai/llm_models.py out 2>&1 | tee llm.log || { tail -n 20 llm.log | sed 's|^|::error title=llm::|'; exit 1; }
          grep -E "==>|GGUF" llm.log | sed 's|^|::notice title=llm::|'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ki-2
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            out/*

  # Helfer-Programm für den Chat (llama.cpp), je System
  helper:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: slimsort-llm-linux-x86_64, flags: '-C target-feature=+avx2,+fma,+f16c,+bmi2' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: slimsort-llm-windows-x86_64.exe, flags: '-C target-feature=+avx2,+fma,+f16c,+bmi2,+crt-static' }
          - { os: macos-latest, target: aarch64-apple-darwin, name: slimsort-llm-macos-aarch64, flags: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, name: slimsort-llm-macos-x86_64, flags: '-C target-feature=+avx2,+fma,+f16c,+bmi2' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-llm, key: '${{ matrix.target }}' }
      - name: Bauen
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.flags }}
        run: |
          cd src-llm
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../out
          f=target/${{ matrix.target }}/release/slimsort-llm
          [ -f "$f.exe" ] && f="$f.exe"
          cp "$f" "../out/${{ matrix.name }}"
          ls -la ../out
      - name: Prüfen
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./out/${{ matrix.name }} --version
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ki-2
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: out/*
