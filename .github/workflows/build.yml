# Baut automatisch die Installer für Windows und Mac (Tauri).
# Ergebnis: unter "Actions" -> letzter Lauf -> "Artifacts".
# Auf main (und bei einem Versions-Tag) entsteht ein Release, von dem die
# Download-Seite immer die neueste Version verlinkt.
#
# Optionale Geheimnisse (Settings -> Secrets -> Actions), siehe VEROEFFENTLICHEN.md:
#   Mac:     MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# Ohne sie wird trotzdem gebaut, aber unsigniert (dann warnt macOS beim ersten Öffnen).
name: Installer bauen

on:
  push:
    branches: [main, v2-tauri]
    tags: ['v*']
    # Nur Texte/Webseiten/Videos geändert → keine neuen Installer bauen
    paths-ignore: ['website/**', 'brand-site/**', 'docs/**', 'marketing/**', 'scripts/video/**', '*.md', '.github/workflows/pages.yml']
  workflow_dispatch:

# Neuer Push auf denselben Zweig bricht ältere, noch laufende Durchläufe ab
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests: Rust-Logik + Oberfläche + kompletter Durchlauf mit der echten App (Linux)
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb python3-pil
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: App bauen
        run: npx tauri build --debug --no-bundle
      - name: E2E-Test
        shell: bash
        run: |
          pip install --break-system-packages pillow-heif || true
          mkdir -p e2e-shots
          set -o pipefail
          ok=0
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e/run.cjs e2e-shots 2>&1 | tee e2e-shots/run.log || ok=1
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e/v2.cjs e2e-shots/v2 2>&1 | tee e2e-shots/v2.log || ok=1
          if [ $ok != 0 ]; then
            # letzte Zeilen als Hinweise anzeigen (Logs sind sonst nicht überall abrufbar)
            for f in e2e-shots/*.log; do tail -n 12 "$f" | sed "s|^|::error title=$f::|"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: e2e-shots, if-no-files-found: ignore }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Installer (Setup.exe) + portable ZIP
        shell: bash
        run: |
          npx tauri build --bundles nsis
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release/SlimSort-Setup.exe
          cp src-tauri/target/release/slimsort.exe release/SlimSort.exe
          cd release && 7z a -tzip SlimSort-Windows-portable.zip SlimSort.exe && rm SlimSort.exe
          ls -la
      - name: Microsoft-Store-Paket (.msix)
        continue-on-error: true
        shell: pwsh
        run: ./src-tauri/windows/make-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SlimSort-Windows
          path: |
            release/*.exe
            release/*.zip
            release/*.msix
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    env:
      HAS_APPLE: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Signiert + notarisiert (wenn Apple-Zugang hinterlegt)
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles dmg
          npx tauri build --target x86_64-apple-darwin --bundles dmg
      - name: Unsigniert (ohne Apple-Zugang, „ad-hoc“ signiert)
        if: env.HAS_APPLE != 'true'
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          npx tauri build --target x86_64-apple-darwin --bundles dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Dateien benennen
        run: |
          mkdir -p release
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release/SlimSort-Mac.dmg
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg release/SlimSort-Mac-Intel.dmg
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: SlimSort-Mac
          path: release/*.dmg
          if-no-files-found: error

  # Veröffentlicht die Dateien als Version "v<version aus package.json>".
  # Gleiche Version erneut hochgeladen -> Dateien werden ersetzt.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SlimSort ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** SlimSort-Setup.exe herunterladen und doppelklicken.
            **Mac (Apple-Chip M1–M4):** SlimSort-Mac.dmg öffnen und die App auf „Programme“ ziehen.
            **Älterer Mac mit Intel-Prozessor:** SlimSort-Mac-Intel.dmg
            Anleitung mit Bildern: https://slimbitapps.github.io/SlimSort
          files: |
            out/SlimSort-Setup.exe
            out/SlimSort-Mac.dmg
            out/SlimSort-Mac-Intel.dmg
            out/SlimSort-Windows-portable.zip
