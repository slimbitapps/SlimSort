# Baut automatisch die Installer für Windows und Mac (Tauri).
# Ergebnis: unter "Actions" -> letzter Lauf -> "Artifacts".
# Auf main (und bei einem Versions-Tag) entsteht ein Release, von dem die
# Download-Seite immer die neueste Version verlinkt.
#
# Optionale Geheimnisse (Settings -> Secrets -> Actions), siehe VEROEFFENTLICHEN.md:
#   Mac:     MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# Ohne sie wird trotzdem gebaut, aber unsigniert (dann warnt macOS beim ersten Öffnen).
name: Installer bauen

on:
  push:
    branches: [main, v2-tauri]
    tags: ['v*']
    # Nur Texte/Webseiten/Videos geändert → keine neuen Installer bauen
    paths-ignore: ['scripts/ai/**', 'src-llm/**', '.github/workflows/ki-modell.yml', 'website/**', 'brand-site/**', 'docs/**', 'marketing/**', 'scripts/video/**', '*.md', '.github/workflows/pages.yml']
  workflow_dispatch:

# Neuer Push auf denselben Zweig bricht ältere, noch laufende Durchläufe ab
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests: Rust-Logik + Oberfläche + kompletter Durchlauf mit der echten App (Linux)
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb python3-pil ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run typecheck
      - name: KI-Modell (für Tests)
        uses: actions/cache@v4
        with: { path: ki-modell, key: ki-modell-1 }
      - name: KI-Modell laden
        run: |
          mkdir -p ki-modell && cd ki-modell
          for f in slimsort-ki-1.safetensors slimsort-ki-1-ref.json; do
            [ -s "$f" ] || curl -fsSL -o "$f" "https://github.com/slimbitapps/SlimSort/releases/download/ki-modell-1/$f"
          done
          ls -la
      - name: KI-Modelle Stufe „Ausgewogen“ (Zwischenspeicher)
        uses: actions/cache@v4
        with: { path: ki-2, key: ki-2-balanced-1 }
      - name: KI-Modelle Stufe „Ausgewogen“ laden
        run: |
          mkdir -p ki-2 && cd ki-2
          for f in slimsort-ki-siglip2-b16.safetensors slimsort-ki-siglip2-b16-ref.json slimsort-llm-qwen3-1.7b.gguf; do
            [ -s "$f" ] || curl -fsSL --retry 4 -o "$f" "https://github.com/slimbitapps/SlimSort/releases/download/ki-2/$f"
          done
          # Helfer immer frisch (wird mit src-llm neu gebaut)
          curl -fsSL --retry 4 -o slimsort-llm-linux-x86_64 "https://github.com/slimbitapps/SlimSort/releases/download/ki-2/slimsort-llm-linux-x86_64"
          chmod +x slimsort-llm-linux-x86_64
          ls -la
      - run: npm test
        env:
          FOTOSORT_AI_MODEL: ${{ github.workspace }}/ki-modell/slimsort-ki-1.safetensors
      - name: Rust-Vergleich SigLIP 2
        working-directory: src-tauri
        run: cargo test --lib ai::tests::matches_reference -- --nocapture
        env:
          FOTOSORT_AI_MODEL: ${{ github.workspace }}/ki-2/slimsort-ki-siglip2-b16.safetensors
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: App bauen
        run: npx tauri build --debug --no-bundle
      - name: E2E-Test
        shell: bash
        run: |
          pip install --break-system-packages pillow-heif || true
          mkdir -p e2e-shots
          set -o pipefail
          ok=0
          # Ein Test schlägt fehl → nur dessen letzte Zeilen als Hinweis (GitHub zeigt höchstens 10)
          run() { name=$1; shift; "$@" 2>&1 | tee e2e-shots/$name.log || { ok=1; tail -n 8 e2e-shots/$name.log | sed "s|^|::error title=$name::|"; }; }
          run run xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e/run.cjs e2e-shots
          run v2 xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e/v2.cjs e2e-shots/v2
          run ki env FOTOSORT_AI_FILE=$PWD/ki-modell/slimsort-ki-1.safetensors xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e/ai.cjs e2e-shots/ki
          pip install --break-system-packages scikit-image || true
          python3 scripts/ai/sample_photos.py /tmp/beispielfotos
          mkdir -p /tmp/ki-ausgewogen && for f in slimsort-ki-siglip2-b16.safetensors slimsort-llm-qwen3-1.7b.gguf slimsort-llm-linux-x86_64; do ln -sf $PWD/ki-2/$f /tmp/ki-ausgewogen/$f; done
          run ki-chat env FOTOSORT_AI_DIR=/tmp/ki-ausgewogen FOTOSORT_AI_PICS=/tmp/beispielfotos xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e/ai-llm.cjs e2e-shots/ki-chat
          exit $ok
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: e2e-shots, if-no-files-found: ignore }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Installer (Setup.exe) + portable ZIP
        shell: bash
        run: |
          npx tauri build --bundles nsis
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release/SlimSort-Setup.exe
          cp src-tauri/target/release/slimsort.exe release/SlimSort.exe
          cd release && 7z a -tzip SlimSort-Windows-portable.zip SlimSort.exe && rm SlimSort.exe
          ls -la
      - name: Microsoft-Store-Paket (.msix)
        continue-on-error: true
        shell: pwsh
        run: ./src-tauri/windows/make-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SlimSort-Windows
          path: |
            release/*.exe
            release/*.zip
            release/*.msix
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    env:
      HAS_APPLE: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Signiert + notarisiert (wenn Apple-Zugang hinterlegt)
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles dmg
          npx tauri build --target x86_64-apple-darwin --bundles dmg
      - name: Unsigniert (ohne Apple-Zugang, „ad-hoc“ signiert)
        if: env.HAS_APPLE != 'true'
        run: |
          npx tauri build --target aarch64-apple-darwin --bundles dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          npx tauri build --target x86_64-apple-darwin --bundles dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Dateien benennen
        run: |
          mkdir -p release
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release/SlimSort-Mac.dmg
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg release/SlimSort-Mac-Intel.dmg
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: SlimSort-Mac
          path: release/*.dmg
          if-no-files-found: error

  # Veröffentlicht die Dateien als Version "v<version aus package.json>".
  # Gleiche Version erneut hochgeladen -> Dateien werden ersetzt.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SlimSort ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** SlimSort-Setup.exe herunterladen und doppelklicken.
            **Mac (Apple-Chip M1–M4):** SlimSort-Mac.dmg öffnen und die App auf „Programme“ ziehen.
            **Älterer Mac mit Intel-Prozessor:** SlimSort-Mac-Intel.dmg
            Anleitung mit Bildern: https://slimbitapps.github.io/SlimSort
          files: |
            out/SlimSort-Setup.exe
            out/SlimSort-Mac.dmg
            out/SlimSort-Mac-Intel.dmg
            out/SlimSort-Windows-portable.zip
