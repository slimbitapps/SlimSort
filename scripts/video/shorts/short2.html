<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070910; font-family: Inter, system-ui, sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; display: none; }
  .abs { position: absolute; }
  .grad { background: linear-gradient(90deg, #3b8bff, #1ec8f0 55%, #3ee089); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .word { display: inline-block; white-space: pre; }
  .head { left: 40px; right: 40px; text-align: center; font-weight: 900; letter-spacing: -2px; line-height: 1.05; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .photo { position: absolute; left: 0; top: 0; width: 900px; height: 600px; border-radius: 26px; overflow: hidden; display: none;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.08); transform-origin: 50% 50%; will-change: transform; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .folder { position: absolute; top: 1270px; width: 320px; height: 270px; border-radius: 30px; background: rgba(16,20,30,.92);
    border: 2px solid rgba(255,255,255,.08); box-shadow: 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; transform-origin: 50% 60%; }
  .folder .nm { font-size: 40px; font-weight: 800; }
  .folder .ct { font-size: 34px; color: #a9b3c8; font-variant-numeric: tabular-nums; font-weight: 600; }
  .folder .kb { position: absolute; top: -26px; right: -14px; min-width: 76px; padding: 10px 14px; border-radius: 16px; background: #fff; color: #111;
    text-align: center; font: 800 42px Inter, sans-serif; box-shadow: 0 7px 0 #9aa3b5, 0 14px 30px rgba(0,0,0,.5); }
  .cap { position: absolute; display: flex; gap: 18px; left: 50%; top: 395px; transform: translateX(-50%); }
  .cap kbd { display: inline-block; min-width: 130px; padding: 22px 32px; border-radius: 26px; background: linear-gradient(180deg, #ffffff, #e8ebf1);
    color: #111; text-align: center; font: 800 64px Inter, sans-serif; box-shadow: 0 12px 0 #9aa3b5, 0 24px 50px rgba(0,0,0,.55); }
  .chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 999px; background: rgba(14,18,28,.94);
    border: 1px solid rgba(255,255,255,.14); font-size: 42px; font-weight: 800; white-space: nowrap; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  /* Ordnerfenster im Einstieg */
  .fw { position: absolute; left: 60px; top: 560px; width: 960px; height: 900px; border-radius: 26px; background: #1b1e25; overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 1px #2b303a; }
  .fw .bar { height: 76px; display: flex; align-items: center; gap: 18px; padding: 0 26px; background: #22262f; font-size: 30px; font-weight: 700; }
  .fw .bar span { margin-left: auto; color: #ff7b7b; font-size: 26px; }
  .fw .grid { position: absolute; left: 24px; right: 24px; top: 100px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .fw .grid img { width: 100%; aspect-ratio: 3/2; object-fit: cover; border-radius: 10px; display: block; }
  .fdest { position: absolute; display: flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 20px; background: #262b36; font-size: 36px; font-weight: 700; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../motion/core.js"></script>
<script>
const HD = C.photosHD;
const FOLDERS = [['Family', '#5b8cff'], ['Holiday', '#2fbf71'], ['Nature', '#f5a524']];
const folderSvg = (c) => `<svg width="110" height="90" viewBox="0 0 24 20"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h6l2 2.2h10A1.5 1.5 0 0 1 22 5.7V17a1.5 1.5 0 0 1-1.5 1.5h-18A1.5 1.5 0 0 1 1 17z" fill="${c}"/><path d="M1 7h21v10a1.5 1.5 0 0 1-1.5 1.5h-18A1.5 1.5 0 0 1 1 17z" fill="${c}" opacity=".75"/></svg>`;
const CURSOR = '<svg viewBox="0 0 24 24" width="54" height="54"><path d="M4 2l15 10.5-6.6 1.2 3.9 7.6-3 1.5-3.9-7.6L4 20z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>';

// ---------- 1: Einstieg – mühsames Ziehen
scene('hook', (r, s) => {
  s.t1 = words(r, 'Stop dragging photos', { top: '160px', fontSize: '92px' });
  s.t1.className += ' head';
  s.t2 = words(r, 'one by one.', { top: '275px', fontSize: '92px', color: '#ff6b6b' });
  s.t2.className += ' head';
  const fw = el('div', 'fw', r, `<div class="bar">📁 Summer 2025<span>2,147 items</span></div><div class="grid"></div>`);
  s.tiles = [];
  for (let i = 0; i < 15; i++) {
    const im = el('img', '', fw.querySelector('.grid'));
    im.src = C.photos[(i * 5 + 2) % C.photos.length];
    s.tiles.push(im);
  }
  s.dest = el('div', 'fdest', r, `${folderSvg('#2fbf71').replace('width="110" height="90"', 'width="52" height="42"')}Holiday`);
  css(s.dest, { left: '620px', top: '470px' });
  s.ghost = el('img', 'abs', r);
  css(s.ghost, { width: '260px', borderRadius: '12px', boxShadow: '0 20px 50px rgba(0,0,0,.6)', opacity: 0.9 });
  s.cur = el('div', 'abs', r, CURSOR);
}, (s, lt, D) => {
  drawWords(s.t1, lt, 0.05, 0.08);
  drawWords(s.t2, lt, 0.4, 0.08);
  // langsames Ziehen eines Fotos in den Ordner (zweimal)
  const tile = s.tiles[4], b = { x: 60 + 24 + 1 * (912 / 3) + 145, y: 560 + 100 + 1 * 215 + 95 };
  const dest = { x: 760, y: 515 };
  const cyc = (D - 0.3) / 2;
  const q = (lt % cyc) / cyc, round = Math.floor(lt / cyc);
  const grab = 0.25, drop = 0.85;
  let x, y, dragging = false;
  if (q < grab) { x = lerp(900, b.x, E.io(q / grab)); y = lerp(1500, b.y, E.io(q / grab)); }
  else if (q < drop) { const k = E.io((q - grab) / (drop - grab)); x = lerp(b.x, dest.x, k); y = lerp(b.y, dest.y, k) - Math.sin(k * Math.PI) * 80; dragging = true; }
  else { x = dest.x; y = dest.y; }
  s.ghost.src = s.tiles[round ? 7 : 4].src;
  css(s.ghost, { display: dragging ? 'block' : 'none', left: x - 90 + 'px', top: y - 50 + 'px' });
  css(s.cur, { left: x - 8 + 'px', top: y - 6 + 'px' });
  s.tiles.forEach((t, i) => (t.style.opacity = (i === 4 && (round > 0 || q > grab)) || (i === 7 && round > 0 && q > grab) ? 0.25 : 1));
  s.dest.style.background = q > drop && q < drop + 0.08 ? '#2f7bff' : '#262b36';
});

// ---------- 2–6: Das Prinzip – Taste drücken, Foto fliegt in den Ordner
const CX = 540, CY = 860;
scene('board', (r, s) => {
  s.titles = ['1 folder = 1 key', 'Press a key. Done.', 'Space = skip', '', 'Undo anytime'].map((t) => {
    const e = el('div', 'abs head', r, t);
    css(e, { top: '190px', fontSize: '92px' });
    return e;
  });
  s.counter = el('div', 'abs head', r);
  css(s.counter, { top: '130px', fontSize: '110px', fontVariantNumeric: 'tabular-nums' });
  s.cap = el('div', 'cap', r);
  s.folders = FOLDERS.map(([n, c], i) => {
    const f = el('div', 'folder', r, `${folderSvg(c)}<div class="nm">${n}</div><div class="ct">0 photos</div><div class="kb">${i + 1}</div>`);
    css(f, { left: 30 + i * 360 + 'px' });
    return f;
  });
  s.chips = ['↺ Undo anytime', '🛡 Never overwrites'].map((t, i) => {
    const e = el('div', 'chip', r, t);
    css(e, { left: '50%', top: '1570px' });
    return e;
  });
  s.pool = [];
  s.r = r;
}, (s, lt, D) => {
  const [o2, o3, o4, o5, o6] = s.pOff;
  const L = (i) => (i < 4 ? s.pOff[i + 1] : D) - s.pOff[i];
  // ---- Ereignisse (einmal berechnen)
  if (!s.ev) {
    const ev = [];
    const L3 = L(1), L4 = L(2), L5 = L(3), L6 = L(4);
    for (const [f, k] of [[0, 0.19], [0, 0.53], [1, 0.675], [2, 0.81]]) ev.push({ t: o3 + k * L3, kind: 'send', f });
    ev.push({ t: o4 + 0.38 * L4, kind: 'skip' });
    const seq = [1, 0, 2, 1, 1, 0, 2, 1, 0, 1, 2, 1, 0, 1, 1, 2, 0, 1];
    const n = Math.floor((0.88 * L5) / 0.3);
    for (let i = 0; i < n; i++) ev.push({ t: o5 + 0.08 * L5 + i * 0.3, kind: 'send', f: seq[i % seq.length], fast: true });
    ev.push({ t: o6 + 0.28 * L6, kind: 'undo' });
    // Fotos zuordnen
    let ptr = 0;
    const stack = [];
    for (const e of ev) {
      if (e.kind === 'send') { e.photo = ptr; stack.push(e); ptr++; }
      else if (e.kind === 'skip') { e.photo = ptr; ptr++; }
      else { const last = stack.pop(); e.photo = last.photo; e.f = last.f; e.displaced = ptr; ptr = last.photo; }
      e.ptrAfter = ptr;
    }
    s.ev = ev;
    s.counts0 = [0, 0, 0];
  }
  const ev = s.ev;
  const photoEl = (i) => {
    if (!s.pool[i]) {
      const d = el('div', 'photo', s.r, '<img/>');
      d.querySelector('img').src = HD[(i * 7 + 3) % HD.length];
      s.pool[i] = d;
    }
    return s.pool[i];
  };
  s.pool.forEach((d) => d && (d.style.display = 'none'));
  const show = (i, x, y, sc = 1, rot = 0, op = 1, z = 1) => {
    const d = photoEl(i);
    css(d, { display: 'block', opacity: op, zIndex: z, transform: `translate(${x - 450}px, ${y - 300}px) rotate(${rot}deg) scale(${sc})` });
  };
  const fpos = (f) => ({ x: 30 + f * 360 + 160, y: 1270 + 120 });
  // ---- aktueller Zustand
  const past = ev.filter((e) => e.t <= lt);
  const last = past[past.length - 1];
  const ptr = last ? last.ptrAfter : 0;
  const appear = E.out(p(lt, o2 + 0.7 * L(0), 0.5));
  // Mittleres Foto
  if (!last) show(0, CX + (1 - appear) * 300, CY, 0.9 + 0.1 * appear, 0, appear, 2);
  else if (last.kind === 'undo') {
    const k = E.io(p(lt, last.t, 0.5)), fp = fpos(last.f);
    show(ptr, lerp(fp.x, CX, k), lerp(fp.y, CY, k) - Math.sin(k * Math.PI) * 160, lerp(0.12, 1, k), lerp(-10, 0, k), 1, 3);
    const k2 = E.in(p(lt, last.t, 0.3));
    if (k2 < 1) show(last.displaced, CX + k2 * 700, CY, 1 - 0.1 * k2, 0, 1 - k2, 2);
  } else {
    const kin = E.out(p(lt, last.t + 0.06, last.fast ? 0.2 : 0.32));
    show(ptr, CX + (1 - kin) * 260, CY, 0.92 + 0.08 * kin, 0, kin, 2);
  }
  // fliegende Fotos
  for (const e of past) {
    const dur = e.fast ? 0.32 : 0.48;
    if (lt >= e.t + dur || e.kind === 'undo') continue;
    const k = E.io(p(lt, e.t, dur));
    if (e.kind === 'send') {
      const fp = fpos(e.f);
      show(e.photo, lerp(CX, fp.x, k), lerp(CY, fp.y, k) - Math.sin(k * Math.PI) * 180, lerp(1, 0.12, k), lerp(0, e.f === 0 ? -12 : e.f === 2 ? 12 : 4, k), 1 - p(k, 0.85, 0.15), 4);
    } else {
      show(e.photo, CX - k * 900, CY + k * 60, 1 - 0.15 * k, -8 * k, 1 - k, 4);
    }
  }
  // Zähler in den Ordnern
  const counts = [0, 0, 0];
  for (const e of past) {
    if (e.kind === 'send' && lt >= e.t + (e.fast ? 0.32 : 0.48)) counts[e.f]++;
  }
  const undo = past.find((e) => e.kind === 'undo');
  const ramp = E.io(p(lt, o5 + 0.08 * L(3), 0.88 * L(3)));
  const target = [412, 1104, 431];
  s.folders.forEach((f, i) => {
    const shown = Math.round(lerp(counts[i], target[i], ramp)) - (undo && undo.f === i ? 1 : 0);
    f.querySelector(".ct").textContent = `${shown.toLocaleString("en-US")} ${shown === 1 ? "photo" : "photos"}`;
    const landed = past.filter((e) => e.kind === 'send' && e.f === i && lt >= e.t + (e.fast ? 0.32 : 0.48) && lt < e.t + (e.fast ? 0.32 : 0.48) + 0.22).length;
    const ka = E.back(p(lt, o2 + i * 0.35 * L(0) * 0.6 + 0.15, 0.45));
    f.style.opacity = p(lt, o2 + i * 0.35 * L(0) * 0.6 + 0.15, 0.2);
    f.style.transform = `translateY(${(1 - ka) * 60}px) scale(${(landed ? 1.08 : 1) * (0.8 + 0.2 * ka)})`;
    f.style.borderColor = landed ? FOLDERS[i][1] : 'rgba(255,255,255,.08)';
  });
  // große Taste oben
  const keyEv = [...past].reverse().find((e) => lt < e.t + 0.55);
  if (keyEv) {
    const kp = p(lt, keyEv.t - 0.05, 0.1) * (1 - p(lt, keyEv.t + 0.08, 0.1));
    const label = keyEv.kind === 'skip' ? ['Space'] : keyEv.kind === 'undo' ? ['Ctrl', 'Z'] : [String(keyEv.f + 1)];
    s.cap.innerHTML = label.map((x) => `<kbd style="transform:translateY(${kp * 10}px);box-shadow:0 ${12 - kp * 10}px 0 #9aa3b5,0 24px 50px rgba(0,0,0,.55)${x === 'Space' ? ';min-width:340px' : ''}">${x}</kbd>`).join('');
    s.cap.style.opacity = 1 - p(lt, keyEv.t + 0.4, 0.15);
  } else s.cap.innerHTML = '';
  // Überschriften je Absatz
  const phase = lt < o3 ? 0 : lt < o4 ? 1 : lt < o5 ? 2 : lt < o6 ? 3 : 4;
  s.titles.forEach((e, i) => {
    const st = s.pOff[i];
    const k = E.out(p(lt, st + 0.05, 0.35));
    e.style.opacity = i === phase ? k : 0;
    e.style.transform = `translateY(${(1 - k) * 30}px)`;
  });
  if (phase === 1) s.titles[1].innerHTML = 'Press a key. <span class="grad">Done.</span>';
  s.counter.style.opacity = phase === 3 ? E.out(p(lt, o5, 0.3)) : 0;
  const total = Math.round(1000 * ramp);
  s.counter.innerHTML = `<span class="grad">${total.toLocaleString('en-US')}</span><span style="font-size:60px"> photos</span><span style="font-size:52px;color:#c7d0e2;letter-spacing:0"> · ~10 min</span>`;
  s.chips.forEach((c, i) => {
    const at = o6 + (0.35 + i * 0.25) * L(4);
    const k = E.back(p(lt, at, 0.4));
    c.style.opacity = phase === 4 ? p(lt, at, 0.2) : 0;
    c.style.transform = `translateX(${i === 0 ? '-105%' : '5%'}) scale(${0.6 + 0.4 * k})`;
  });
}, 5);
// Geräusche: Tastenklick, Wusch, Pop
scenes[scenes.length - 1].sfx = function (D) {
  const s = this;
  // Ereignisse wie im Zeichnen berechnen
  s.draw(s, 0, D);
  const out = [];
  for (const e of s.ev) {
    out.push({ t: e.t - 0.03, type: 'click' });
    if (e.kind === 'undo') { out.push({ t: e.t + 0.1, type: 'click' }); out.push({ t: e.t + 0.05, type: 'whoosh-back' }); }
    else if (!e.fast || Math.random() < 0.5) out.push({ t: e.t + 0.02, type: 'whoosh' });
    if (e.kind === 'send') out.push({ t: e.t + (e.fast ? 0.32 : 0.48), type: 'pop' });
  }
  return out;
};

// ---------- 7: echte App + Download
scene('cta', (r, s) => {
  s.handheld = 0.8;
  s.a = laptopWin(r, 900, 540, 560);
  s.lbl = el('div', 'chip', r, '✓ The real app');
  css(s.lbl, { left: '50%', top: '210px', fontSize: '38px' });
  s.icon = el('img', 'abs', r);
  s.icon.src = ICON;
  css(s.icon, { left: '465px', top: '880px', width: '150px', height: '150px', borderRadius: '36px', boxShadow: '0 20px 60px rgba(30,140,255,.45)' });
  s.name = el('div', 'abs head', r, 'Slim<span class="grad">Sort</span>');
  css(s.name, { top: '1050px', fontSize: '140px', letterSpacing: '-4px' });
  s.free = el('div', 'abs head', r, 'Free · Windows &amp; Mac');
  css(s.free, { top: '1220px', fontSize: '54px', fontWeight: 600, color: '#c7d0e2', letterSpacing: 0 });
  s.btn = el('div', 'abs', r, 'Link in profile ↗');
  css(s.btn, { left: '240px', width: '600px', top: '1340px', textAlign: 'center', padding: '28px 0', borderRadius: '28px', fontSize: '56px', fontWeight: 800,
    background: 'linear-gradient(90deg, #1560f0, #0a9fd0)', boxShadow: '0 16px 50px rgba(21,96,240,.55)' });
}, (s, lt, D) => {
  setImg(s.a.img, frame('grid-light', M['grid-light'].grid + 0.5 + lt * 0.4));
  const k = E.out(p(lt, 0, 0.7));
  place(s.a, { s: 0.92 + 0.06 * k, ry: -12 * (1 - k), y: 30 * (1 - k) });
  s.lbl.style.opacity = p(lt, 0.2, 0.3);
  s.lbl.style.transform = 'translateX(-50%)';
  const ki = E.back(p(lt, 0.4, 0.5));
  s.icon.style.transform = `scale(${ki})`;
  [s.name, s.free, s.btn].forEach((e, i) => {
    const kk = E.out(p(lt, 0.6 + i * 0.2, 0.5));
    e.style.opacity = kk;
    e.style.transform = `translateY(${(1 - kk) * 40}px)` + (i === 2 ? ` scale(${1 + 0.035 * Math.sin(lt * 5) * p(lt, 1.6, 0.3)})` : '');
  });
});

start({ captionTop: 1700 });
</script>
</body>
</html>
