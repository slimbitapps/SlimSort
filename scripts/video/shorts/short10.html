9],[6,6,8],[4,6,3],[8,8,6]],[[132,114,74],[130,111,78],[145,130,99],[133,122,92],[131,121,94],[111,100,80],[85,75,63],[45,36,31],[21,12,13],[11,4,11],[10,8,13],[6,5,10],[9,9,11],[4,6,3],[5,7,4]],[[131,113,73],[129,111,75],[142,127,94],[134,126,90],[115,110,78],[83,79,54],[50,44,28],[15,11,2],[11,7,4],[9,7,10],[7,7,9],[6,7,9],[5,7,6],[4,6,3],[6,8,3]],[[140,121,79],[130,112,74],[132,118,81],[112,107,69],[99,96,61],[75,71,44],[44,41,22],[12,10,0],[9,8,4],[9,9,9],[6,8,7],[4,6,5],[6,8,5],[6,8,3],[5,7,2]],[[136,117,74],[124,106,66],[118,104,65],[100,92,53],[91,89,51],[73,69,40],[44,42,21],[12,10,0],[8,7,2],[9,9,7],[7,7,7],[7,7,7],[7,7,5],[10,11,6],[8,9,3]],[[128,110,62],[116,99,55],[108,95,53],[98,91,49],[93,89,51],[76,73,42],[47,45,22],[14,10,0],[8,7,2],[10,9,7],[8,8,8],[9,9,7],[6,7,2],[11,12,7],[11,12,6]],[[127,109,59],[115,99,50],[104,91,46],[99,92,48],[94,90,52],[79,76,45],[51,49,26],[16,13,0],[8,8,0],[10,9,5],[11,11,9],[13,13,11],[8,9,4],[10,11,6],[7,8,2]],[[120,103,51],[114,98,47],[106,94,46],[103,94,51],[97,94,53],[85,80,48],[58,56,31],[20,18,3],[8,8,0],[7,8,3],[9,9,7],[6,6,4],[5,5,3],[9,10,5],[7,8,2]],[[114,97,45],[112,96,45],[105,93,43],[99,91,45],[94,91,50],[87,82,50],[66,65,37],[28,27,9],[10,10,0],[5,6,0],[6,8,5],[8,10,7],[6,8,5],[7,9,6],[5,6,1]],[[117,100,48],[114,98,47],[100,88,38],[88,80,34],[85,82,39],[84,80,45],[69,68,40],[34,33,13],[12,14,1],[5,8,1],[6,8,5],[8,10,9],[4,6,5],[8,10,9],[11,13,10]],[[112,94,44],[112,96,45],[105,93,43],[97,89,42],[90,87,44],[81,77,40],[76,75,45],[46,45,24],[9,11,0],[8,11,2],[4,9,5],[4,8,7],[5,9,10],[7,11,12],[11,13,12]]]};
const SRC = HD.find((x) => x.endsWith('zz-chelsea.jpg'));
const IW = 451, IH = 300, FIT = 1080 / IW, MAXS = 170;
const TX = 164.5, TY = 110.5;   // Ziel: Rand zwischen grüner Iris und Pupille
const Z0 = 2.4, Z1 = 10.4, ZB0 = 16.4, ZB1 = 19.8;

scene('zoom', (r, s) => {
  s.cv = el('canvas', 'zoom', r);
  s.cv.width = 1080; s.cv.height = 1920;
  s.img = new Image();
  s.img.src = SRC;
  el('div', 'top', r);
  const t = (html, top, size = 84) => { const e = el('div', 'abs head', r, html); css(e, { top: top + 'px', fontSize: size + 'px' }); return e; };
  s.a = t('Zoom into this photo 🔍', 160);
  s.b = t('closer…', 160);
  s.c = t('closer… 👀', 160);
  s.d = t('Those squares?<br><span class="grad">PIXELS.</span>', 130, 92);
  s.e = t('Each one is just<br><span class="grad">3 numbers</span> 🎨', 130, 88);
  s.f = t('A phone photo has', 130, 70);
  s.n = t('', 230, 120);
  s.g = t('That’s <span class="grad">36 million numbers</span><br>for ONE photo 🤯', 130, 72);
  s.h = t('Your gallery has<br>thousands of them 😅', 1380, 80);
  s.tag = el('div', 'chip', r, '<img src="' + ICON + '" style="width:48px;height:48px;border-radius:12px"> Too many photos? SlimSort sorts them — free');
  css(s.tag, { left: '50%', top: '1660px', fontSize: '30px', fontWeight: 700 });
}, (s, lt, D) => {
  if (!s.img.complete) pending.push(s.img.decode().catch(() => {}));
  // Zoomstufe: hinein (exponentiell), halten, schnell wieder heraus
  const zin = (E.io(p(lt, Z0, Z1 - Z0)) + p(lt, Z0, Z1 - Z0)) / 2, zout = E.io(p(lt, ZB0, ZB1 - ZB0));
  const k = zin * (1 - zout);
  const sc = FIT * Math.pow(MAXS / FIT, k);
  const cx = lerp(IW / 2, TX, Math.min(1, k * 1.6)), cy = lerp(IH / 2, TY, Math.min(1, k * 1.6));
  const g = s.cv.getContext('2d');
  g.fillStyle = '#070910'; g.fillRect(0, 0, 1080, 1920);
  g.imageSmoothingEnabled = sc < 6;
  const ox = 540 - cx * sc, oy = 960 - cy * sc;
  if (s.img.complete) g.drawImage(s.img, ox, oy, IW * sc, IH * sc);
  // Gitter + Werte, wenn ganz nah
  const gridA = p(sc, 60, 60) * (1 - zout);
  const valA = p(lt, 11.9, 0.5) * (1 - p(lt, ZB0 - 0.2, 0.3));
  if (gridA > 0) {
    g.strokeStyle = `rgba(0,0,0,${0.55 * gridA})`;
    g.lineWidth = 3;
    const x0 = Math.floor(-ox / sc), y0 = Math.floor(-oy / sc);
    for (let x = x0; x <= x0 + 1080 / sc + 1; x++) { g.beginPath(); g.moveTo(ox + x * sc, 0); g.lineTo(ox + x * sc, 1920); g.stroke(); }
    for (let y = y0; y <= y0 + 1920 / sc + 1; y++) { g.beginPath(); g.moveTo(0, oy + y * sc); g.lineTo(1080, oy + y * sc); g.stroke(); }
    if (valA > 0) {
      g.font = '800 30px Inter, sans-serif';
      g.textAlign = 'center';
      PX.px.forEach((row, j) => row.forEach(([R, G, B], i) => {
        const x = ox + (PX.x0 + i + 0.5) * sc, y = oy + (PX.y0 + j + 0.5) * sc;
        if (x < -sc || x > 1080 + sc || y < 380 || y > 1920 + sc) return;
        const light = R * 0.3 + G * 0.59 + B * 0.11 > 110;
        g.globalAlpha = valA;
        g.fillStyle = light ? 'rgba(0,0,0,.85)' : 'rgba(255,255,255,.92)';
        ['R ' + R, 'G ' + G, 'B ' + B].forEach((txt, q) => {
          g.fillStyle = q === 0 ? (light ? '#8a0000' : '#ff8a8a') : q === 1 ? (light ? '#005a12' : '#8affa0') : (light ? '#00218a' : '#9ab4ff');
          g.fillText(txt, x, y - 32 + q * 38);
        });
        g.globalAlpha = 1;
      }));
    }
  }
  // Texte
  const show = (e, a, b) => { e.style.opacity = p(lt, a, 0.25) * (1 - p(lt, b, 0.25)); e.style.transform = `translateY(${(1 - E.out(p(lt, a, 0.35))) * 30}px)`; };
  show(s.a, 0.1, Z0 + 0.6);
  show(s.b, 1.9, 2.8);
  show(s.c, 2.8, 9.2);
  show(s.d, 9.3, 11.8);
  show(s.e, 11.9, ZB0 - 0.1);
  show(s.f, ZB0, ZB1 + 1.1);
  show(s.n, ZB0, ZB1 + 1.1);
  const cnt = Math.round(12e6 * E.io(p(lt, ZB0 + 0.2, ZB1 - ZB0)) / 1000) * 1000;
  s.n.innerHTML = `<span class="grad">${cnt.toLocaleString('en-US')}</span><br><span style="font-size:60px;color:#c7d0e2;letter-spacing:0">pixels (12 MP)</span>`;
  show(s.g, ZB1 + 1.3, D + 1);
  show(s.h, 24.0, D + 1);
  s.tag.style.opacity = p(lt, 26.1, 0.4) * 0.92;
  s.tag.style.transform = 'translateX(-50%)';
}, 6);
scenes[0].sfx = () => [{ t: Z0, type: 'whoosh' }, { t: 9.6, type: 'pop' }, { t: Z1 + 1.1, type: 'pop' }, { t: ZB0, type: 'whoosh-back' }, { t: ZB1 + 1.3, type: 'pop' }];

start({ captionTop: 1790 });
