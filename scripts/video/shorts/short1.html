<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070910; font-family: Inter, system-ui, sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; display: none; }
  .abs { position: absolute; }
  .grad { background: linear-gradient(90deg, #3b8bff, #1ec8f0 55%, #3ee089); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .word { display: inline-block; white-space: pre; }
  .head { left: 50px; right: 50px; text-align: center; font-weight: 900; letter-spacing: -2px; line-height: 1.05; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .chip { position: absolute; display: flex; align-items: center; gap: 16px; padding: 14px 26px 14px 14px; border-radius: 999px;
    background: rgba(12,15,24,.9); border: 1px solid rgba(255,255,255,.12); font-size: 44px; font-weight: 800; white-space: nowrap; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  .chip kbd { min-width: 70px; padding: 8px 14px; border-radius: 14px; background: #fff; color: #111; font: 800 42px Inter, sans-serif; text-align: center; box-shadow: 0 6px 0 #9aa3b5; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../motion/core.js"></script>
<script>
const m = M.main;
// Tastendrücke im Rohclip (siehe record-all.cjs: erster Druck 0,9 s nach "sorting", dann alle 1,05 s)
const press = (i) => m.sorting + 0.9 + i * 1.05;

// ---------- 1: Hook – Fotowand
scene('hook', (r, s) => {
  s.wall = el('div', 'abs', r);
  css(s.wall, { left: '-500px', top: '-300px', width: '2100px', display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: '14px' });
  for (let i = 0; i < 6 * 16; i++) {
    const im = el('img', '', s.wall);
    im.src = photos[(i * 5 + Math.floor(i / 6) * 3) % photos.length];
    css(im, { width: '100%', aspectRatio: '3/2', objectFit: 'cover', borderRadius: '10px', display: 'block' });
  }
  const sh = el('div', 'abs', r);
  css(sh, { inset: 0, background: 'linear-gradient(180deg, rgba(7,9,16,.92) 0%, rgba(7,9,16,.55) 30%, rgba(7,9,16,.55) 65%, rgba(7,9,16,.9) 100%)' });
  s.t1 = words(r, '2,000 photos.', { top: '290px', fontSize: '128px' });
  s.t1.className += ' head';
  s.t2 = words(r, 'ONE folder.', { top: '440px', fontSize: '128px' }, 'grad');
  s.t2.className += ' head';
  s.cnt = el('div', 'chip', r, '📁 Summer 2025 · <span style="color:#ff7b7b">2,147 items</span>');
  css(s.cnt, { left: '50%', top: '640px', fontSize: '40px', padding: '16px 30px' });
}, (s, lt, D) => {
  s.wall.style.transform = `perspective(1400px) rotateX(24deg) rotateZ(-10deg) translateY(${-lt * 90}px) scale(1.15)`;
  drawWords(s.t1, lt, 0.05, 0.1);
  drawWords(s.t2, lt, 0.7, 0.1);
  const k = E.back(p(lt, 1.4, 0.4));
  s.cnt.style.opacity = p(lt, 1.4, 0.2);
  s.cnt.style.transform = `translateX(-50%) scale(${0.7 + 0.3 * k})`;
});

// ---------- 2: "in 10 Minuten" – Laptop auf dem Tisch
scene('promise', (r, s) => {
  s.handheld = 1;
  desk(r);
  s.a = laptopWin(r, 980, 540, 960);
  s.t = words(r, 'Sorted in 10 minutes', { top: '250px', fontSize: '110px' });
  s.t.className += ' head';
  s.t._w.slice(2).forEach((w) => w.classList.add('grad'));
}, (s, lt, D) => {
  setImg(s.a.img, frame('main', m.sorting - 1.0 + lt * 0.9));
  const k = E.out(p(lt, 0, 1.0));
  place(s.a, { s: 0.9 + 0.1 * k + lt * 0.02, ry: -14 * (1 - k), y: 30 * (1 - k) });
  drawWords(s.t, lt, 0.1, 0.1);
});

// ---------- 3: Taste = Ordner (Ausschnitt groß)
scene('keys', (r, s) => {
  s.a = cropWin(r, { x: 40, y: 470, w: 1000, h: 794, srcX: 330, srcY: 70, scale: 1000 / 1260 });
  s.t = words(r, '1 key = 1 folder', { top: '220px', fontSize: '120px' });
  s.t.className += ' head';
  const items = [['1', '#5b8cff', 'Family'], ['2', '#2fbf71', 'Holiday'], ['Space', '', 'Skip']];
  s.chips = items.map(([k, c, n], i) => {
    const e = el('div', 'chip', r, `<kbd>${k}</kbd>${c ? `<span style="width:20px;height:20px;border-radius:50%;background:${c}"></span>` : ''}${n}`);
    css(e, { top: '1300px', left: [40, 380, 720][i] + 'px', fontSize: '38px' });
    return e;
  });
}, (s, lt, D) => {
  // Rohclip so legen, dass die Tasten ungefähr zum Sprechtext passen
  const c0 = press(0) - 1.6;
  setImg(s.a.img, frame('main', c0 + lt));
  const k = E.out(p(lt, 0, 0.6));
  place(s.a, { s: 0.94 + 0.06 * k });
  drawWords(s.t, lt, 0.05, 0.12);
  const at = [press(0) - c0, press(1) - c0, press(4) - c0];
  s.chips.forEach((e, i) => {
    const kk = E.back(p(lt, at[i] - 0.1, 0.35));
    e.style.opacity = p(lt, at[i] - 0.1, 0.15);
    e.style.transform = `scale(${0.6 + 0.4 * kk})`;
  });
});

// ---------- 4: schnell – Zähler
scene('fast', (r, s) => {
  s.a = cropWin(r, { x: 40, y: 470, w: 1000, h: 794, srcX: 330, srcY: 70, scale: 1000 / 1260 });
  s.num = el('div', 'abs head', r);
  css(s.num, { top: '230px', fontSize: '150px', fontVariantNumeric: 'tabular-nums' });
}, (s, lt, D) => {
  setImg(s.a.img, frame('main', m.fast + lt * ((m.fastEnd - m.fast) / D)));
  place(s.a, { s: 1 + lt * 0.015 });
  const n = Math.round(1000 * E.io(p(lt, 0.1, D - 0.4)));
  s.num.innerHTML = `<span class="grad">${n.toLocaleString('en-US')}</span> <span style="font-size:70px">photos</span>`;
});

// ---------- 5: Abspann
scene('cta', (r, s) => {
  s.icon = el('img', 'abs', r);
  s.icon.src = ICON;
  css(s.icon, { left: '390px', top: '330px', width: '300px', height: '300px', borderRadius: '70px', boxShadow: '0 30px 90px rgba(30,140,255,.45)' });
  s.name = el('div', 'abs head', r, 'Slim<span class="grad">Sort</span>');
  css(s.name, { top: '690px', fontSize: '170px', letterSpacing: '-5px' });
  s.free = el('div', 'abs head', r, '100% free · Windows &amp; Mac');
  css(s.free, { top: '900px', fontSize: '56px', fontWeight: 600, color: '#c7d0e2', letterSpacing: 0 });
  s.btn = el('div', 'abs', r, 'Link in profile ↗');
  css(s.btn, { left: '240px', width: '600px', top: '1060px', textAlign: 'center', padding: '30px 0', borderRadius: '28px', fontSize: '58px', fontWeight: 800,
    background: 'linear-gradient(90deg, #1560f0, #0a9fd0)', boxShadow: '0 16px 50px rgba(21,96,240,.55)' });
}, (s, lt, D) => {
  const ki = E.back(p(lt, 0, 0.5));
  s.icon.style.transform = `scale(${ki})`;
  [s.name, s.free, s.btn].forEach((e, i) => {
    const kk = E.out(p(lt, 0.2 + i * 0.2, 0.5));
    e.style.opacity = kk;
    e.style.transform = `translateY(${(1 - kk) * 40}px)` + (i === 2 ? ` scale(${1 + 0.035 * Math.sin(lt * 5) * p(lt, 1, 0.3)})` : '');
  });
});

start({ captionTop: 1430 });
</script>
</body>
</html>
