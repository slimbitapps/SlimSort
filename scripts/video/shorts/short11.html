<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="common.css" />
<style>
  .step { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-weight: 900; font-size: 80px; letter-spacing: -2px; line-height: 1.05; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .step .n { display: inline-block; width: 92px; height: 92px; line-height: 92px; border-radius: 50%; background: linear-gradient(135deg, #2f7bff, #1ec8f0); font-size: 56px; margin-right: 18px; vertical-align: middle; }
  .beta { display: inline-block; padding: 6px 18px; border-radius: 999px; font-size: 34px; font-weight: 800; letter-spacing: 2px; color: #ffb43a; background: rgba(245,165,36,.16); border: 2px solid rgba(245,165,36,.5); vertical-align: middle; }
  .panel { position: absolute; left: 90px; width: 900px; border-radius: 34px; background: rgba(16,20,30,.95); border: 2px solid rgba(255,255,255,.08); box-shadow: 0 30px 90px rgba(0,0,0,.55); overflow: hidden; }
  .bub { position: absolute; max-width: 700px; padding: 26px 34px; border-radius: 34px; font-size: 44px; font-weight: 600; line-height: 1.3; }
  .me { right: 40px; background: linear-gradient(135deg, #2f7bff, #1a9fe0); border-bottom-right-radius: 10px; }
  .ai { left: 40px; background: #232836; border-bottom-left-radius: 10px; }
  .th { position: absolute; width: 250px; height: 168px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .th img, .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .big { position: absolute; border-radius: 30px; overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  .sugg { position: absolute; padding: 18px 30px; border-radius: 999px; font-size: 44px; font-weight: 800; background: rgba(16,20,30,.95); border: 3px solid #f5a524; box-shadow: 0 0 40px rgba(245,165,36,.4); white-space: nowrap; }
  .box { position: absolute; border: 6px solid #3ee089; border-radius: 22px; box-shadow: 0 0 30px rgba(62,224,137,.6); }
  .tag { position: absolute; padding: 12px 24px; border-radius: 16px; background: #3ee089; color: #04130a; font-size: 40px; font-weight: 900; white-space: nowrap; }
  .row { position: absolute; left: 40px; right: 40px; display: flex; align-items: center; gap: 20px; font-size: 40px; font-weight: 700; }
  .btn { padding: 16px 30px; border-radius: 18px; background: #2a3040; border: 2px solid rgba(255,255,255,.15); font-size: 38px; font-weight: 800; }
  .mon { position: absolute; border-radius: 18px; background: #111; border: 10px solid #2b2f37; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; }
  .mon img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../motion/core.js"></script>
<script src="common.js"></script>
<script>
// Kein Sprechtext: SlimSort 2.0 – fünf Neuerungen, je eine kleine Animation, am Ende die echte App
const P = (n) => HD.find((x) => x.endsWith(n + '.jpg'));
const step = (r, n, html) => el('div', 'step', r, `<span class="n">${n}</span>${html}`);
const thumb = (r, src, x, y, w = 250, h = 168) => { const e = el('div', 'th', r, `<img src="${src}">`); css(e, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); return e; };

// 1 · Aufhänger
scene('hook', (r, s) => {
  s.a = words(r, 'My photo app just got AI 🤖', { top: '560px', fontSize: '100px' });
  s.a.className += ' head';
  s.b = el('div', 'abs head', r, 'Slim<span class="grad">Sort</span> 2.0');
  css(s.b, { top: '900px', fontSize: '150px', letterSpacing: '-5px' });
  s.c = el('div', 'abs head', r, '<span class="beta">AI · BETA</span>&nbsp; 5 new things in 30 s');
  css(s.c, { top: '1110px', fontSize: '46px', fontWeight: 700, color: '#c7d0e2', letterSpacing: 0 });
}, (s, lt) => {
  drawWords(s.a, lt, 0.05, 0.1);
  popIn(s.b, lt, 0.7, '');
  fadeIn(s.c, lt, 1.2);
});
scenes[0].sfx = () => [{ t: 0.7, type: 'pop' }];

// 2 · Einfach fragen (Chat)
scene('chat', (r, s) => {
  s.h = step(r, 1, 'Just ask');
  s.p = el('div', 'panel', r);
  css(s.p, { top: '420px', height: '1020px' });
  s.me = el('div', 'bub me', s.p);
  css(s.me, { top: '60px' });
  s.ai = el('div', 'bub ai', s.p, 'Found 3 beach photos 🏖️');
  css(s.ai, { top: '260px' });
  s.t = [1, 2, 3].map((k, i) => thumb(s.p, P('beach-' + k), 40 + (i % 2) * 290, 420 + Math.floor(i / 2) * 200, 270, 180));
  s.more = el('div', 'bub ai', s.p, 'Move them to <b>Holiday</b>? ✈️');
  css(s.more, { top: '850px' });
}, (s, lt) => {
  fadeIn(s.h, lt, 0.05);
  const msg = 'Show me my beach photos';
  const n = Math.floor(clamp((lt - 0.5) / 1.2) * msg.length);
  s.me.textContent = msg.slice(0, n) + (n < msg.length ? '▍' : '');
  s.me.style.opacity = p(lt, 0.4, 0.1);
  fadeIn(s.ai, lt, 2.0, 20);
  s.t.forEach((e, i) => { const k = E.back(p(lt, 2.4 + i * 0.15, 0.4)); e.style.opacity = p(lt, 2.4 + i * 0.15, 0.1); e.style.transform = `scale(${0.5 + 0.5 * k})`; });
  fadeIn(s.more, lt, 3.6, 20);
});
scenes[1].sfx = () => [{ t: 2.0, type: 'pop' }, { t: 2.4, type: 'pop' }, { t: 3.6, type: 'pop' }];

// 3 · Lernt die Ordner
scene('learn', (r, s) => {
  s.h = step(r, 2, 'It learns your folders');
  s.ph = el('div', 'big', r, `<img src="${P('mountains-2')}">`);
  s.sg = el('div', 'sugg', r, '✨ AI suggests: Nature · 94 %');
  s.cap = el('div', 'cap', r);
  css(s.cap, { top: '1240px' });
  s.f = [0, 1, 2].map((i) => folderEl(r, i, 30 + i * 350, 1470));
}, (s, lt) => {
  fadeIn(s.h, lt, 0.05);
  const fly = E.io(p(lt, 2.6, 0.6));
  css(s.ph, { left: lerp(90, 30 + 2 * 350 + 60, fly) + 'px', top: lerp(400, 1510, fly) + 'px', width: lerp(900, 200, fly) + 'px', height: lerp(600, 134, fly) + 'px', opacity: 1 - p(fly, 0.85, 0.15) });
  css(s.sg, { left: '50%', top: '1060px', opacity: p(lt, 0.9, 0.2) * (1 - p(lt, 2.6, 0.2)), transform: `translateX(-50%) scale(${0.7 + 0.3 * E.back(p(lt, 0.9, 0.4))})` });
  drawKeys(s.cap, lt, [[2.3, ['3']]]);
  s.f.forEach((f, i) => {
    f.style.opacity = p(lt, 0.2 + i * 0.1, 0.3);
    const hit = i === 2 && lt > 3.2 && lt < 3.6;
    f.style.transform = `scale(${hit ? 1.1 : 1})`;
    f.style.borderColor = hit ? FOLDERS[2][1] : 'rgba(255,255,255,.08)';
    f.querySelector('.ct').textContent = photosLabel(i === 2 && lt > 3.2 ? 1 : 0);
  });
});
scenes[2].sfx = () => [{ t: 0.9, type: 'pop' }, { t: 2.3, type: 'click' }, { t: 2.65, type: 'whoosh' }, { t: 3.2, type: 'pop' }];

// 4 · Merkt sich Haustiere, Personen, Dinge
scene('remember', (r, s) => {
  s.h = step(r, 3, 'It remembers<br><span style="font-size:64px">pets, people &amp; things</span>');
  s.ph = el('div', 'big', r, `<img src="${P('zz-chelsea')}">`);
  css(s.ph, { left: '90px', top: '480px', width: '900px', height: '600px' });
  s.me = el('div', 'bub me', r, 'This is Chelsea, my cat 🐱');
  css(s.me, { top: '1160px', right: '90px' });
  s.box = el('div', 'box', r);
  css(s.box, { left: '90px', top: '480px', width: '900px', height: '600px' });
  s.tag = el('div', 'tag', r, '✓ Chelsea');
  s.ok = el('div', 'chip', r, '✓ Remembered – finds her in every photo');
  css(s.ok, { left: '50%', top: '1420px', fontSize: '40px' });
}, (s, lt) => {
  fadeIn(s.h, lt, 0.05);
  fadeIn(s.ph, lt, 0.2, 20);
  fadeIn(s.me, lt, 0.8, 20);
  const k = E.out(p(lt, 1.6, 0.5));
  // Rahmen zieht sich um das Gesicht zusammen
  css(s.box, { opacity: p(lt, 1.6, 0.15), left: lerp(90, 250, k) + 'px', top: lerp(480, 500, k) + 'px', width: lerp(900, 470, k) + 'px', height: lerp(600, 520, k) + 'px' });
  css(s.tag, { left: '250px', top: '440px', opacity: p(lt, 2.2, 0.2), transform: `scale(${0.6 + 0.4 * E.back(p(lt, 2.2, 0.4))})` });
  s.ok.style.opacity = p(lt, 2.8, 0.3);
  s.ok.style.transform = 'translateX(-50%)';
});
scenes[3].sfx = () => [{ t: 0.8, type: 'pop' }, { t: 2.2, type: 'pop' }];

// 5 · Alles rückgängig
scene('undo', (r, s) => {
  s.h = step(r, 4, 'Every AI step<br><span style="font-size:64px">can be undone</span>');
  s.p = el('div', 'panel', r);
  css(s.p, { top: '440px', height: '300px' });
  s.r1 = el('div', 'row', s.p, '<span style="font-size:52px">✨</span><span style="flex:1">AI sorted 12 photos → Holiday</span><span class="btn">↶ Undo</span>');
  css(s.r1, { top: '40px' });
  s.r2 = el('div', 'row', s.p, '<span style="font-size:52px">📁</span><span style="flex:1;color:#a9b3c8">Created folder “Italy”</span><span class="btn">↶ Undo</span>');
  css(s.r2, { top: '170px' });
  s.btn = s.r1.querySelector('.btn');
  const names = ['beach-1', 'beach-2', 'beach-3', 'sunset-1', 'sunset-2', 'lake-1', 'city-1', 'flowers-1', 'desert-1', 'snow-1', 'lake-2', 'forest-1'];
  s.t = names.map((n, i) => thumb(r, P(n), 0, 0, 230, 154));
  s.f = folderEl(r, 1, 380, 1470);
  s.ok = el('div', 'chip', r, '✓ All 12 back where they were');
  css(s.ok, { left: '50%', top: '1400px', fontSize: '40px' });
}, (s, lt) => {
  fadeIn(s.h, lt, 0.05);
  fadeIn(s.p, lt, 0.2, 20);
  const press = lt > 1.6 && lt < 1.85;
  css(s.btn, { background: press ? '#2f7bff' : '#2a3040', transform: `scale(${press ? 0.92 : 1})` });
  s.f.style.opacity = p(lt, 0.2, 0.3);
  s.f.querySelector('.ct').textContent = photosLabel(Math.max(0, Math.round(12 - 12 * p(lt, 1.8, 1.0))));
  s.t.forEach((e, i) => {
    const k = E.out(p(lt, 1.8 + i * 0.07, 0.55));
    const gx = 30 + (i % 4) * 255, gy = 800 + Math.floor(i / 4) * 175;
    css(e, { left: lerp(480, gx, k) + 'px', top: lerp(1510, gy, k) + 'px', transform: `scale(${0.3 + 0.7 * k})`, opacity: p(lt, 1.8 + i * 0.07, 0.1) });
  });
  s.ok.style.opacity = p(lt, 3.2, 0.3);
  s.ok.style.transform = 'translateX(-50%)';
});
scenes[4].sfx = () => [{ t: 1.6, type: 'click' }, { t: 1.85, type: 'whoosh-back' }, { t: 3.2, type: 'pop' }];

// 6 · Zwei Bildschirme (echte App)
scene('dual', (r, s) => {
  s.h = step(r, 5, 'Two screens');
  s.m1 = el('div', 'mon', r, `<img src="${P('beach-2')}">`);
  css(s.m1, { left: '90px', top: '380px', width: '900px', height: '540px' });
  s.l1 = el('div', 'chip', r, '🖥️ Photo – full screen');
  css(s.l1, { left: '50%', top: '940px', fontSize: '36px' });
  s.m2 = el('div', 'mon', r, `<img src="${frame('dual', 0)}">`);
  css(s.m2, { left: '90px', top: '1080px', width: '900px', height: '506px' });
  s.l2 = el('div', 'chip', r, '💻 All folders &amp; AI – big and clear');
  css(s.l2, { left: '50%', top: '1610px', fontSize: '36px' });
}, (s, lt) => {
  fadeIn(s.h, lt, 0.05);
  [s.m1, s.m2].forEach((m, i) => { const k = E.out(p(lt, 0.3 + i * 0.5, 0.5)); m.style.opacity = k; m.style.transform = `translateY(${(1 - k) * 60}px)`; });
  [s.l1, s.l2].forEach((l, i) => { l.style.opacity = p(lt, 0.8 + i * 0.5, 0.3); l.style.transform = 'translateX(-50%)'; });
});

// 7 · Beta-Hinweis + echte App
scene('beta', (r, s) => {
  s.a = el('div', 'abs head', r, '<span class="beta" style="font-size:56px;padding:10px 30px">AI · BETA</span>');
  css(s.a, { top: '600px' });
  s.b = el('div', 'abs head', r, 'It can be wrong –<br><span class="grad">you stay in control.</span>');
  css(s.b, { top: '780px', fontSize: '92px' });
  s.c = el('div', 'abs head', r, 'Runs 100% on your computer 🔒<br>Your photos never leave it.');
  css(s.c, { top: '1110px', fontSize: '54px', fontWeight: 700, color: '#c7d0e2', letterSpacing: 0, lineHeight: 1.3 });
}, (s, lt) => {
  popIn(s.a, lt, 0.05, '');
  fadeIn(s.b, lt, 0.4);
  fadeIn(s.c, lt, 1.2);
});
ctaScene({ label: '✓ The real app · v2.0', clip: () => ['single', 0] });

start({ captionTop: 1790 });
</script>
</body>
</html>
